services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kg_eventplan
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: kg_eventplan
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kg_eventplan -d kg_eventplan"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Catches outgoing email (invitations, password links) for local development.
  # Inbox: http://localhost:8025
  mail:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
